<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zon Institute</title>
<style>
:root{--ink:#000;--black:#000;--muted:#000;--rule:#000;--soft:#fff;--accent:#000;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
body{font:15px/1.6 var(--sans);color:var(--ink);background:#fff;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{width:min(1040px,calc(100% - 40px));margin:0 auto}

/* header */
header{border-top:3px solid var(--accent);border-bottom:1px solid var(--rule);background:#fff;position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;gap:8px 28px;padding:12px 0;min-height:60px}
.brand{text-decoration:none;font:500 1.05rem var(--serif);white-space:nowrap}
.brand em{font-style:normal;font-weight:400;color:var(--muted)}
nav{display:flex;gap:2px;font-size:.88rem;flex:1;min-width:0}
nav a{text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:6px;white-space:nowrap}
nav a:hover{color:var(--ink);background:var(--soft)}
nav a[aria-current]{color:var(--ink);background:var(--soft);font-weight:500}
.acct{display:flex;align-items:center;gap:6px;margin-left:auto}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 16px;border-radius:8px;border:1px solid var(--rule);background:#fff;color:var(--ink);font:500 .88rem var(--sans);text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.15)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--soft)}
.btn.full{width:100%;height:42px;font-size:.92rem}

/* page head */
main{flex:1;padding-bottom:72px}
.head{padding:44px 0 32px;max-width:40rem}
h1{font:400 clamp(1.75rem,4vw,2.3rem)/1.15 var(--serif);letter-spacing:-.015em}
h1:focus{outline:none}
.lede{margin-top:12px;font-size:1rem;color:var(--muted);max-width:36rem}
.lede a{color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);margin-bottom:14px}

/* home list */
.sec-t{font:500 .82rem var(--sans);color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--ink)}
.sites{list-style:none;display:grid;grid-template-columns:1fr 1fr;column-gap:40px}
.sites a{display:block;padding:20px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.sites b{display:flex;align-items:center;gap:10px;font:400 1.1rem/1.3 var(--serif);margin-bottom:4px}
.sites span{display:block;color:var(--muted);font-size:.9rem;line-height:1.55}
.sites a:hover b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}


/* prose / legal */
.doc{display:grid;grid-template-columns:200px minmax(0,1fr);gap:56px;align-items:start}
.toc{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px;font-size:.88rem}
.toc a{text-decoration:none;color:var(--muted);padding:5px 0 5px 12px;border-left:2px solid var(--rule)}
.toc a:hover{color:var(--ink);border-color:var(--ink)}
.toc .g{font-weight:600;color:var(--ink);font-size:.82rem;padding:14px 0 4px}
.toc .g:first-child{padding-top:0}
.prose{max-width:38rem}
.prose h2{font:500 1.25rem/1.3 var(--serif);margin:0 0 6px}
.prose h3{font:600 .95rem/1.4 var(--sans);margin:28px 0 4px}
.prose p,.prose li{color:#000;font-size:.95rem;line-height:1.7}
.prose p+p{margin-top:10px}
.prose ul{list-style:none;padding-left:0;margin-top:6px}
.prose section{padding-bottom:40px;margin-bottom:40px;border-bottom:1px solid var(--rule)}
.prose section:last-child{border:0;margin:0}
.upd{font-size:.82rem;color:var(--muted);margin-bottom:28px}

/* auth */
.auth{display:grid;place-items:start center;padding:56px 0 0}
.card{width:min(400px,100%);border:1px solid var(--rule);border-radius:14px;padding:32px 28px}
.card h1{font-size:1.5rem}
.card .lede{font-size:.92rem;margin:6px 0 24px}
.f{display:block;margin-bottom:16px}
.f span{display:flex;justify-content:space-between;font-size:.84rem;font-weight:500;margin-bottom:6px}
.f span a{font-weight:400;color:var(--muted)}
.f input{width:100%;height:42px;padding:0 12px;border:1px solid #000;border-radius:8px;font:inherit;color:var(--ink);background:#fff}
.f input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.chk{display:flex;gap:10px;font-size:.84rem;color:var(--muted);margin:4px 0 20px;align-items:flex-start}
.chk input{margin-top:3px;accent-color:var(--ink)}
.chk a{color:var(--ink)}
.msg{font-size:.84rem;color:var(--muted);margin-top:14px;min-height:1.2em}
.swap{text-align:center;font-size:.88rem;color:var(--muted);margin-top:18px}
.swap a{color:var(--ink);font-weight:500}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:10px;padding:4px;margin-bottom:24px}
.tabs button{height:34px;border:0;border-radius:7px;background:none;font:500 .88rem var(--sans);color:var(--muted);cursor:pointer}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* footer */
footer{background:var(--black);color:#fff;font-size:.86rem}
footer :focus-visible{outline-color:#fff}
.f-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:28px 56px;padding:44px 0 32px}
.f-about{max-width:22rem}
.f-about strong{display:block;font:400 1.2rem var(--serif);color:#fff;margin-bottom:8px}
.f-label{font-size:.8rem;font-weight:500;color:#fff;margin-bottom:12px}
.soc{list-style:none;display:flex;flex-wrap:wrap;gap:6px;max-width:30rem}
.soc a,.soc span{display:inline-flex;padding:6px 12px;border:1px solid rgba(255,255,255,.22);border-radius:999px;color:#fff;text-decoration:none;font-size:.82rem;transition:background .15s,color .15s}
.soc a:hover{background:#fff;color:var(--black)}
.soc span{color:#fff;border-style:dashed;border-color:rgba(255,255,255,.16)}
.f-bot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 40px;padding:20px 0 28px;border-top:1px solid rgba(255,255,255,.12)}
.f-bot ul{list-style:none;display:flex;flex-wrap:wrap;gap:4px 20px}
.f-bot a{text-decoration:none}.f-bot a:hover{color:#fff;text-decoration:underline}
.f-bot a[aria-current],.f-bot p a{color:#fff}

@media(max-width:820px){
 header .wrap{flex-wrap:wrap}
 nav{order:3;flex:0 0 100%;overflow-x:auto;scrollbar-width:none;margin:0 -6px}
 nav::-webkit-scrollbar{display:none}
 .sites{grid-template-columns:1fr}
 .doc{grid-template-columns:1fr;gap:28px}
 .toc{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}
 .toc a{border:1px solid var(--rule);border-radius:999px;padding:5px 12px}
 .toc .g{display:none}
 .head{padding-top:32px}
 .auth{padding-top:32px}
}
@media(max-width:420px){.card{padding:26px 20px}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="#/" id="brand"></a>
  <nav id="nav" aria-label="Main"></nav>
</div></header>
<main id="app"></main>
<footer id="foot"></footer>
<script>
/* Auth hook: set USER to {name:"..."} once a real session exists. */
var USER=null;

var PEF='<a href="https://hnx.github.io/Peffus" target="_blank" rel="noopener noreferrer">Peffus Network</a>';
var URL_={YouTube:"https://www.youtube.com/@",Instagram:"https://www.instagram.com/",X:"https://x.com/",Twitch:"https://www.twitch.tv/",GitHub:"https://github.com/"};
var HUBP=[["YouTube","ZonInstitute"],["Instagram","ZonInstitute"],["X","ZonInstitute"],["GitHub","ZonInstitute"]];
var E={
 education:{n:"Zon Education",s:"Education",c:"#000",d:"Responsible for education and academic activities, including secondary and higher-secondary schooling, curricula, academic standards, examinations, assessments, and certifications.",
  p:[["YouTube","Zon.Education"],["Instagram","ZonEducation"],["X","ZonEducation"]]},
 lab:{n:"Zon Lab",s:"Lab",c:"#000",d:"Responsible for theoretical and applied research, experimentation, innovation, and development.",
  p:[["YouTube","ZonLab"],["X","ZonLab"]]},
 database:{n:"Academic Database of Zon Institute",s:"Academic Database",c:"#000",d:"A database maintained on both public and private servers.",
  p:[["YouTube","AcademicDatabase"],["Instagram","AcademicDatabase"]]},
 events:{n:"Zon Events",s:"Events",c:"#000",d:"Hosts a range of events, including academic and educational events, as well as other events organised under, or associated with, Zon Institute.",
  p:[["YouTube","Zon.Events"],["YouTube","ResearchPrograms"],["YouTube","AcademicEvents"],["Instagram","ResearchPrograms"],["Instagram","Zon.Events"],["X","Zon_Events"],["Twitch","AcademicEvents"]]},
 updates:{n:"Updates",s:"Updates",c:"#000",d:"Announcements and publications from Zon Institute.",p:HUBP}
};
var KEYS=Object.keys(E);
var PAGES={about:"About",privacy:"Privacy & Policy",account:"Account"};
var FLINKS=["about","privacy","account"];
var MODE="login";

function socials(rows,extra){
 return '<ul class="soc">'+rows.map(function(r){return '<li><a href="'+URL_[r[0]]+r[1]+'" target="_blank" rel="noopener noreferrer" aria-label="'+r[0]+': @'+r[1]+'">'+r[0]+' @'+r[1]+'</a></li>'}).join("")+(extra||"")+'</ul>';
}
function footer(k){
 var e=E[k],hub=!e,p=hub?HUBP:e.p;
 var about=hub?'<strong>Zon Institute</strong><p>A privately operated institute spanning research, education, events and related areas.</p>'
  :'<strong>'+e.n+'</strong><p>An official website of Zon Institute.</p>';
 var extra=hub?'<li><span>Contact: not yet announced</span></li>':"";
 var links=[["","Zon Institute"]].concat(KEYS.map(function(i){return [i,E[i].s]})).concat(FLINKS.map(function(i){return [i,PAGES[i]]})).map(function(l){
  return '<li><a href="#/'+l[0]+'"'+(l[0]==k?' aria-current="page"':"")+'>'+l[1].replace("&","&amp;")+'</a></li>'}).join("");
 return '<div class="wrap f-top"><div class="f-about">'+about+'</div><div><div class="f-label">Official accounts</div>'+socials(p,extra)+'</div></div>'+
  '<div class="wrap f-bot"><ul aria-label="Zon Institute websites">'+links+'</ul><p>Under '+PEF+'</p></div>';
}
function head(t,d,dot){return '<div class="head">'+(dot?'<div class="tag">Zon Institute</div>':'')+'<h1 tabindex="-1">'+t+'</h1>'+(d?'<p class="lede">'+d+'</p>':'')+'</div>'}

function privacy(){
 return head("Privacy & Policy","How Zon Institute handles your information, and the rules for using our websites and accounts.")+
 '<div class="doc"><nav class="toc" aria-label="On this page"><div class="g">Privacy</div><a href="#p-collect">Information we collect</a><a href="#p-use">How we use it</a><a href="#p-rights">Your choices</a><div class="g">Policy</div><a href="#q-use">Using our sites</a><a href="#q-acct">Accounts</a><a href="#q-contact">Contact</a></nav>'+
 '<div class="prose"><p class="upd">Draft text. Review with your own legal advice before publishing.</p>'+
 '<section id="p-collect"><h2>Information we collect</h2><p>When you create an account we collect your name, email address and password. We may also record basic technical data, such as browser type and pages visited, to keep the sites working.</p></section>'+
 '<section id="p-use"><h2>How we use it</h2><ul><li>To create and secure your account.</li><li>To send messages you ask for, such as event or update notices.</li><li>To maintain and improve Zon Institute websites.</li></ul><p style="margin-top:10px">We do not sell your personal information.</p></section>'+
 '<section id="p-rights"><h2>Your choices</h2><p>You can ask to view, correct or delete your account information at any time. Deleting your account removes your profile from our systems.</p></section>'+
 '<section id="q-use"><h2>Using our sites</h2><p>Zon Institute websites are provided for educational and informational use. Content belongs to Zon Institute or its contributors unless stated otherwise. Do not misuse the sites, attempt to access restricted areas, or interfere with other users.</p></section>'+
 '<section id="q-acct"><h2>Accounts</h2><p>Keep your login details private and tell us if you suspect unauthorised access. We may suspend accounts that break these rules.</p></section>'+
 '<section id="q-contact"><h2>Contact</h2><p>A contact address has not been announced yet. It will be listed here and in the footer.</p></section>'+
 '</div></div>';
}
function auth(){
 if(USER)return '<div class="auth"><div class="card"><h1 tabindex="-1">Your account</h1><p class="lede">'+(USER.name||"Signed in")+'<br>'+USER.email+'</p><button class="btn full" id="out" type="button">Log out</button><p class="msg" id="msg" role="status"></p></div></div>';
 var r=MODE=="reset",s=MODE=="signup";
 if(r)return '<div class="auth"><div class="card"><h1 tabindex="-1">Reset your password</h1><p class="lede">Enter your account email and we will send a link to set a new password.</p>'+
 '<form id="af" novalidate><label class="f"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>'+
 '<button class="btn pri full" type="submit">Send reset link</button><p class="msg" id="msg" role="status"></p></form><p class="swap"><a href="#/account" id="bk">Back to log in</a></p></div></div>';
 return '<div class="auth"><div class="card"><div class="tabs" role="tablist" aria-label="Account">'+
 '<button role="tab" data-m="login" aria-selected="'+!s+'">Log in</button><button role="tab" data-m="signup" aria-selected="'+s+'">Sign up</button></div>'+
 '<h1 tabindex="-1">'+(s?"Create your account":"Welcome back")+'</h1><p class="lede">'+(s?"One account for all Zon Institute sites. Each email can be used for one account only.":"Log in to your Zon Institute account.")+'</p>'+
 '<form id="af" novalidate>'+
 (s?'<label class="f"><span>Full name</span><input name="name" autocomplete="name" required></label>':'')+
 '<label class="f"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>'+
 '<label class="f"><span>Password'+(s?'':'<a href="#/account" id="fp">Forgot password?</a>')+'</span><input name="pw" type="password" autocomplete="'+(s?'new':'current')+'-password" minlength="8" required></label>'+
 (s?'<label class="chk"><input type="checkbox" required><span>I agree to the <a href="#/privacy">Privacy &amp; Policy</a>.</span></label>':'')+
 '<button class="btn pri full" type="submit">'+(s?"Create account":"Log in")+'</button><p class="msg" id="msg" role="status"></p></form></div></div>';
}
function render(){
 var k=location.hash.replace(/^#\/?/,"");if(k=="policy")k="privacy";
 if(k=="login"||k=="signup"){MODE=k;k="account"}
 var e=E[k],pg=PAGES[k],h,title,accent="#000",suffix="";
 if(e){
  accent=e.c;title=e.n+" | Zon Institute";suffix=e.s;
  h='<div class="wrap">'+head(e.n,e.d,1)+'</div>';
 }else if(pg){
  title=pg+" | Zon Institute";suffix=k=="account"?"":pg;
  h='<div class="wrap">'+(k=="privacy"?privacy():k=="about"?head("About","A privately operated institute encompassing research, education, events, and other related areas of activity, fully owned and overseen by "+PEF+"."):auth())+'</div>';
 }else{
  k="";title="Zon Institute";
  h='<div class="wrap">'+head("Zon Institute","A privately operated institute encompassing research, education, events, and other related areas of activity, fully owned and overseen by "+PEF+".")+
   '<div class="sec-t">Sites</div><ul class="sites">'+KEYS.map(function(i){var s=E[i];return '<li><a href="#/'+i+'"><b>'+s.n+'</b><span>'+s.d+'</span></a></li>'}).join("")+'</ul></div>';
 }
 document.getElementById("app").innerHTML=h;
 document.getElementById("nav").innerHTML=KEYS.map(function(i){return '<a href="#/'+i+'"'+(i==k?' aria-current="page"':"")+'>'+E[i].s+'</a>'}).join("");
 document.getElementById("foot").innerHTML=footer(k);
 document.documentElement.style.setProperty("--accent",accent);
 document.getElementById("brand").innerHTML='<span>Zon Institute'+(suffix?' <em>/ '+suffix.replace("&","&amp;")+'</em>':'')+'</span>';
 document.title=title;
 var f=document.getElementById("af"),m=document.getElementById("msg");
 if(f)f.addEventListener("submit",function(ev){ev.preventDefault();
  if(!f.checkValidity()){m.textContent=MODE=="reset"?"Enter a valid email address.":"Check the fields. Password needs at least 8 characters.";return}
  if(!window.ZonAuth){m.textContent="Accounts are not connected yet.";return}
  var d=new FormData(f),em=String(d.get("email")).trim().toLowerCase();/* the email alone identifies an account */
  m.textContent="Please wait...";
  if(MODE=="reset"){
   ZonAuth.reset(em).then(function(){m.textContent="If an account exists for this email, a reset link has been sent. Check your spam folder too."}).catch(function(err){m.textContent=ZonAuth.msg(err)});
   return;
  }
  (MODE=="signup"?ZonAuth.signUp(String(d.get("name")).trim(),em,d.get("pw")):ZonAuth.logIn(em,d.get("pw")))
   .then(function(){location.hash="#/"}).catch(function(err){m.textContent=ZonAuth.msg(err)});
 });
 var fp=document.getElementById("fp");if(fp)fp.onclick=function(ev){ev.preventDefault();MODE="reset";render()};
 var bk=document.getElementById("bk");if(bk)bk.onclick=function(ev){ev.preventDefault();MODE="login";render()};
 var o=document.getElementById("out");if(o)o.onclick=function(){ZonAuth&&ZonAuth.logOut()};
 document.querySelectorAll(".tabs button").forEach(function(t){t.onclick=function(){MODE=t.dataset.m;render()}});
 if(!/^#\/?(privacy|policy)?#/.test(location.hash)){window.scrollTo(0,0)}
 var h1=document.querySelector("h1");if(h1)h1.focus({preventScroll:true});
}
window.addEventListener("hashchange",render);render();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,updateProfile,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

/* Firebase web app config (public by design). */
var cfg={apiKey:"AIzaSyAQR_kcNIG8nRQOu_t5smp-WuB3l7Idt-4",authDomain:"zon-institute-8d429.firebaseapp.com",projectId:"zon-institute-8d429",storageBucket:"zon-institute-8d429.firebasestorage.app",messagingSenderId:"357742935130",appId:"1:357742935130:web:99eabc29393930e865ac63"};

if(cfg.apiKey.indexOf("YOUR_")!==0){
 var auth=getAuth(initializeApp(cfg));
 var ERR={"auth/email-already-in-use":"This email is already registered. Log in, or use Forgot password if you cannot remember it.","auth/invalid-credential":"Email or password is incorrect.","auth/invalid-email":"Enter a valid email address.","auth/weak-password":"Password needs at least 8 characters.","auth/too-many-requests":"Too many attempts. Try again in a few minutes.","auth/network-request-failed":"No connection. Check your internet and try again."};
 window.ZonAuth={
  signUp:function(n,e,p){return createUserWithEmailAndPassword(auth,e,p).then(function(c){return updateProfile(c.user,{displayName:n})}).then(function(){setUser(auth.currentUser)})},
  logIn:function(e,p){return signInWithEmailAndPassword(auth,e,p)},
  logOut:function(){return signOut(auth)},
  reset:function(e){return sendPasswordResetEmail(auth,e)},
  msg:function(x){return ERR[x.code]||"Something went wrong. Try again."}
 };
 function setUser(u){window.USER=u?{name:u.displayName||"",email:u.email}:null;window.render()}
 onAuthStateChanged(auth,setUser);
}
</script>
</body>
</html>
