<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zon Institute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,440;0,9..144,560;1,9..144,440&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000000;
  --ink:#f2f0ea;
  --ink-dim:#a8a6a0;
  --line:rgba(242,240,234,.24);
  --line-strong:rgba(242,240,234,.62);
  --line-hover:rgba(242,240,234,.9);
  --brown-1:#20120a;
  --brown-2:#150b06;
  --brown-3:#3a220f;
  --brown-page:#0b0705;
  --serif:'Fraunces', serif;
  --sans:'Inter', sans-serif;
  --mono:'IBM Plex Mono', monospace;
  --ease:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--black);
  color:var(--ink);
  font-family:var(--sans);
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}
::selection{background:var(--ink);color:var(--black);}

/* ---------- layout shells ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}
.view{flex:1;display:flex;flex-direction:column;animation:fadein .5s var(--ease);}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px clamp(20px,5vw,56px);
  border-bottom:1px solid var(--line);
}
.wordmark{
  font-family:var(--serif);font-weight:440;font-size:15px;letter-spacing:.06em;
  text-transform:uppercase;opacity:.9;transition:opacity .3s var(--ease);
}
.wordmark:hover{opacity:1;}
.crumb{
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink-dim);
  display:flex;align-items:center;gap:8px;
}
.crumb a{transition:color .3s var(--ease);}
.crumb a:hover{color:var(--ink);}

.page-head{
  padding:clamp(40px,8vw,88px) clamp(20px,5vw,56px) clamp(20px,4vw,40px);
  text-align:center;
}
.page-head h1{
  font-family:var(--serif);font-weight:440;
  font-size:clamp(30px,5vw,50px);
  margin:0 0 14px;letter-spacing:-.01em;
}
.page-head p{
  font-family:var(--sans);font-weight:300;font-size:14px;line-height:1.7;
  color:var(--ink-dim);max-width:480px;margin:0 auto;
}

.content{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:0 clamp(20px,5vw,56px) 80px;
  gap:56px;
}

/* ---------- home ---------- */
.home{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 24px;gap:34px;
}
.home-title{
  font-family:var(--serif);font-weight:440;
  font-size:clamp(44px,9vw,96px);
  letter-spacing:-.015em;position:relative;margin:0;
}
.underline-wrap{width:min(560px,80vw);margin:2px auto 0;}
.underline-wrap svg{width:100%;height:22px;overflow:visible;}
.underline-wrap path{
  fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linecap:round;
  opacity:0;
}
.home-sub{
  font-family:var(--sans);font-weight:300;font-size:14.5px;line-height:1.75;
  color:var(--ink-dim);max-width:420px;
}
.nav-grid{
  display:flex;flex-wrap:wrap;justify-content:center;gap:14px;
  max-width:720px;margin-top:6px;
}
.nav-btn{
  border:1px solid var(--line-strong);
  padding:14px 22px;
  font-family:var(--mono);font-size:12px;letter-spacing:.045em;text-transform:uppercase;
  transition:border-color .35s var(--ease), color .35s var(--ease), background-color .35s var(--ease);
}
.nav-btn:hover, .nav-btn:focus-visible{
  border-color:var(--line-hover);
  background:rgba(255,255,255,.04);
}
.nav-btn:focus-visible{outline:1px dashed var(--ink);outline-offset:3px;}

/* ---------- section labels / category rows ---------- */
.category{width:100%;max-width:960px;display:flex;flex-direction:column;gap:22px;align-items:center;}
.category-label{
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-dim);border-bottom:1px solid var(--line);padding-bottom:10px;width:100%;text-align:center;
}
.shelf{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:clamp(18px,3vw,32px);width:100%;
}

/* ---------- book cover ---------- */
.book{
  position:relative;
  width:clamp(170px,26vw,240px);
  display:flex;flex-direction:column;align-items:center;
}
.book-cover{
  position:relative;width:100%;aspect-ratio:1/1;
  background:linear-gradient(155deg,var(--brown-1),var(--brown-2) 70%);
  border:1px solid var(--line-strong);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;text-align:center;padding:16px;
  cursor:pointer;
  transition:transform .4s var(--ease), opacity .4s var(--ease), border-color .3s var(--ease);
}
.book-cover::before{
  content:"";position:absolute;left:14px;top:14px;right:14px;bottom:14px;
  border:1px solid rgba(242,240,234,.12);pointer-events:none;
}
.book-cover:hover{border-color:var(--line-hover);}
.book-cover .spine{
  position:absolute;left:0;top:0;bottom:0;width:7px;
  background:linear-gradient(90deg,var(--brown-3),transparent);
}
.book-title{
  font-family:var(--serif);font-weight:440;font-size:14px;line-height:1.35;
}
.book-meta{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);
}
.book.open .book-cover{opacity:0;transform:scale(.94);pointer-events:none;}

/* empty / future slot */
.book-slot-empty{
  width:clamp(170px,26vw,240px);height:clamp(170px,26vw,240px);
  border:1px dashed var(--line);
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-dim);font-family:var(--mono);font-size:20px;font-weight:300;
  transition:border-color .3s var(--ease), color .3s var(--ease);
}
.book-slot-empty:hover{border-color:var(--line-strong);color:var(--ink);}

/* ---------- open book frame ---------- */
.book-open-wrap{
  width:100%;display:none;
  flex-direction:column;align-items:center;gap:14px;
  opacity:0;transform:scale(1.03);
  transition:opacity .4s var(--ease), transform .4s var(--ease);
}
.book.open .book-open-wrap{opacity:1;transform:scale(1);}
.book-frame{
  position:relative;width:100%;aspect-ratio:1/1;
  perspective:1800px;
  border:1px solid var(--line-strong);
  background:var(--brown-page);
}
.leaves{position:relative;width:100%;height:100%;}
.leaf{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  transform-origin:left center;
  transform:rotateY(0deg);
  transition:none;
}
.leaf-face{
  position:absolute;inset:0;
  backface-visibility:hidden;
  overflow:hidden;
  background:var(--brown-page);
}
.leaf-face.back{
  transform-origin:left center;
  transform:rotateY(180deg);
  background:linear-gradient(160deg,var(--brown-1),var(--brown-2));
  display:flex;align-items:center;justify-content:center;
}
.leaf-face.back::after{
  content:"";width:60%;height:1px;background:rgba(242,240,234,.14);
}
.page-scroll{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  padding:clamp(16px,3vw,26px);
  scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;
}
.page-scroll::-webkit-scrollbar{width:4px;}
.page-scroll::-webkit-scrollbar-thumb{background:var(--line-strong);}
.page-eyebrow{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-dim);margin:0 0 10px;
}
.page-title{
  font-family:var(--serif);font-weight:440;font-size:clamp(16px,2vw,20px);margin:0 0 14px;
}

/* controls under the open book */
.book-controls{
  display:flex;align-items:center;justify-content:center;gap:16px;width:100%;
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;
}
.ctrl-btn{
  width:30px;height:30px;border:1px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;
  transition:border-color .3s var(--ease), background-color .3s var(--ease), opacity .3s var(--ease);
}
.ctrl-btn:hover:not(:disabled){border-color:var(--line-hover);background:rgba(255,255,255,.05);}
.ctrl-btn:disabled{opacity:.25;cursor:default;}
.page-indicator{color:var(--ink-dim);min-width:44px;text-align:center;}
.close-btn{color:var(--ink-dim);transition:color .3s var(--ease);border-bottom:1px solid transparent;}
.close-btn:hover{color:var(--ink);border-color:var(--line);}

/* touch affordance */
.book-frame{touch-action:pan-y;user-select:none;}

/* ---------- inline link list ---------- */
.link-row{
  display:block;padding:10px 0;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:12px;letter-spacing:.01em;
  overflow-wrap:anywhere;word-break:break-word;
  transition:color .3s var(--ease), padding-left .3s var(--ease);
}
.link-row:hover{color:var(--ink);padding-left:6px;}
.link-row:hover::before{content:"— ";}

/* accordion */
.acc{border-top:1px solid var(--line);}
.acc-item{border-bottom:1px solid var(--line);}
.acc-head{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:13px 2px;font-family:var(--sans);font-weight:400;font-size:13px;letter-spacing:.01em;
}
.acc-head .plus{font-family:var(--mono);font-size:14px;transition:transform .4s var(--ease);}
.acc-item.open .plus{transform:rotate(45deg);}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease);}
.acc-item.open .acc-body{grid-template-rows:1fr;}
.acc-body-inner{overflow:hidden;}
.acc-body-pad{padding:2px 2px 12px;}

.empty-row{
  padding:16px 2px;color:var(--ink-dim);font-family:var(--mono);font-size:11.5px;
  border:1px dashed var(--line);text-align:center;letter-spacing:.03em;
}
.affiliate-cols{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-dim);padding:10px 2px;border-bottom:1px solid var(--line);
}
@media (max-width:520px){.affiliate-cols{display:none;}}

/* square link buttons (business units hub) */
.tile-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;
}
.tile-btn{
  aspect-ratio:1;border:1px solid var(--line-strong);width:100%;min-width:0;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
  transition:border-color .3s var(--ease), background-color .3s var(--ease);
  padding:8px;overflow:hidden;
}
.tile-btn:hover{border-color:var(--line-hover);background:rgba(255,255,255,.04);}

/* ---------- pitch black event screen ---------- */
.pitch-black{
  width:100%;max-width:960px;min-height:60vh;
  background:#000;border:1px solid var(--line);
}

/* ---------- about text panel ---------- */
.about-black{
  width:100%;max-width:640px;background:#000;border:1px solid var(--line);
  padding:clamp(24px,5vw,44px);display:flex;flex-direction:column;gap:22px;
}
.about-black p{
  font-family:var(--sans);font-weight:300;font-size:14px;line-height:1.75;
  color:var(--ink);margin:0;
}
.about-black h2{
  font-family:var(--serif);font-weight:440;font-size:19px;margin:0;letter-spacing:-.005em;
}
.about-black pre{
  font-family:var(--mono);font-size:12px;line-height:1.65;color:var(--ink);
  margin:0;white-space:pre;overflow-x:auto;
}

footer.site{
  text-align:center;padding:26px 20px 40px;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-dim);
  border-top:1px solid var(--line);
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important;transition-duration:.15s !important;}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   DATA
   ============================================================ */
const YT_UNITS = [
  {name:"Management Unit", items:[
    {label:"YouTube.com/@BusinessUnits", href:"https://www.youtube.com/@BusinessUnits"}
  ]},
  {name:"Academic Services & Research Unit", items:[
    {label:"YouTube.com/@AcademicDatabase", href:"https://www.youtube.com/@AcademicDatabase"},
    {label:"YouTube.com/@ResearchPrograms", href:"https://www.youtube.com/@ResearchPrograms"}
  ]},
  {name:"Education Programs Unit", items:[
    {label:"YouTube.com/@CoachingInstitution", href:"https://www.youtube.com/@CoachingInstitution"},
    {label:"YouTube.com/@AcademicSubjects", href:"https://www.youtube.com/@AcademicSubjects"},
    {label:"YouTube.com/@AcademicAssessments", href:"https://www.youtube.com/@AcademicAssessments"},
    {label:"YouTube.com/@AcademicCompetitions", href:"https://www.youtube.com/@AcademicCompetitions"},
    {label:"YouTube.com/@PreparationVideos", href:"https://www.youtube.com/@PreparationVideos"},
    {label:"YouTube.com/@TheoreticalFramework", href:"https://www.youtube.com/@TheoreticalFramework"},
    {label:"YouTube.com/@IntroductoryCourses", href:"https://www.youtube.com/@IntroductoryCourses"}
  ]}
];

const ABOUT_LINKS = {
  x:{label:"X.com/ZonInstitute", href:"https://x.com/ZonInstitute"},
  youtube:{label:"YouTube.com/@ZonInstitute", href:"https://www.youtube.com/@ZonInstitute"},
  instagram:{label:"Instagram.com/ZonInstitute", href:"https://www.instagram.com/ZonInstitute"},
  github:{label:"GitHub.com/ZonInstitute", href:"https://github.com/ZonInstitute"}
};

const NAV_ITEMS = [
  {label:"About Us", route:"about"},
  {label:"Zon Institute's Business Units", route:"business-units"},
  {label:"Zon Institute's Events", route:"events"},
  {label:"Affiliates of Zon Institute", route:"affiliates"},
  {label:"Connect With Us", route:"connect"}
];

/* ============================================================
   SMALL HELPERS
   ============================================================ */
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k === "class") e.className = attrs[k];
    else if(k === "html") e.innerHTML = attrs[k];
    else if(k.startsWith("on") && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return e;
}

function linkRow(label, href){
  return el("a", {class:"link-row", href, target:"_blank", rel:"noopener"}, label);
}

function accordion(sections){
  const wrap = el("div", {class:"acc"});
  sections.forEach((s, idx)=>{
    const item = el("div", {class:"acc-item" + (idx===0?" open":"")});
    const head = el("button", {class:"acc-head", type:"button"}, [
      el("span", {}, s.name),
      el("span", {class:"plus"}, "+")
    ]);
    const bodyInner = el("div", {class:"acc-body-pad"});
    if(s.items && s.items.length){
      s.items.forEach(it=>bodyInner.appendChild(linkRow(it.label, it.href)));
    } else {
      bodyInner.appendChild(el("div", {class:"empty-row"}, s.emptyText || "Nothing listed yet"));
    }
    const body = el("div", {class:"acc-body"}, [
      el("div", {class:"acc-body-inner"}, bodyInner)
    ]);
    head.addEventListener("click", ()=> item.classList.toggle("open"));
    item.appendChild(head);
    item.appendChild(body);
    wrap.appendChild(item);
  });
  return wrap;
}

/* ============================================================
   BOOK COMPONENT
   pages: [{ eyebrow, title, build(scrollEl) }]
   ============================================================ */
function Book({title, meta, pages}){
  const bookEl = el("div", {class:"book"});
  const cover = el("div", {class:"book-cover"}, [
    el("div", {class:"spine"}),
    el("div", {class:"book-title"}, title),
    meta ? el("div", {class:"book-meta"}, meta) : null
  ]);

  const frame = el("div", {class:"book-frame"});
  const leavesEl = el("div", {class:"leaves"});
  frame.appendChild(leavesEl);

  const N = pages.length;
  const leafEls = [];
  let current = 0;
  let zCounter = N + 10;

  pages.forEach((p, i)=>{
    const leaf = el("div", {class:"leaf"});
    leaf.style.zIndex = N - i;
    const front = el("div", {class:"leaf-face front"});
    const scroll = el("div", {class:"page-scroll"});
    if(p.eyebrow) scroll.appendChild(el("div", {class:"page-eyebrow"}, p.eyebrow));
    if(p.title) scroll.appendChild(el("div", {class:"page-title"}, p.title));
    p.build(scroll);
    front.appendChild(scroll);
    const back = el("div", {class:"leaf-face back"});
    leaf.appendChild(front);
    leaf.appendChild(back);
    leaf.__rot = 0;
    leavesEl.appendChild(leaf);
    leafEls.push(leaf);
  });

  const prevBtn = el("button", {class:"ctrl-btn", type:"button", "aria-label":"Previous page"}, "‹");
  const nextBtn = el("button", {class:"ctrl-btn", type:"button", "aria-label":"Next page"}, "›");
  const indicator = el("div", {class:"page-indicator"}, N ? `01 / ${String(N).padStart(2,"0")}` : "");
  const closeBtn = el("button", {class:"close-btn", type:"button"}, "Close");
  const controls = el("div", {class:"book-controls"}, [prevBtn, indicator, nextBtn, closeBtn]);

  const openWrap = el("div", {class:"book-open-wrap"}, [frame, N>1 ? controls : el("div",{class:"book-controls"},[closeBtn])]);
  bookEl.appendChild(cover);
  bookEl.appendChild(openWrap);

  function setRot(leaf, deg, animate){
    leaf.style.transition = animate ? "transform .62s cubic-bezier(.65,0,.35,1)" : "none";
    leaf.style.transform = `rotateY(${deg}deg)`;
    leaf.__rot = deg;
  }

  function updateControls(){
    indicator.textContent = `${String(current+1).padStart(2,"0")} / ${String(N).padStart(2,"0")}`;
    prevBtn.disabled = current <= 0;
    nextBtn.disabled = current >= N-1;
  }
  updateControls();

  let busy = false;
  function goNext(){
    if(current >= N-1 || busy) return Promise.resolve();
    busy = true;
    const leaf = leafEls[current];
    setRot(leaf, -180, true);
    return new Promise(resolve=>{
      const onEnd = ()=>{
        leaf.removeEventListener("transitionend", onEnd);
        leaf.style.zIndex = -1;
        current++;
        updateControls();
        busy = false;
        resolve();
      };
      leaf.addEventListener("transitionend", onEnd);
    });
  }
  function goPrev(){
    if(current <= 0 || busy) return Promise.resolve();
    busy = true;
    const leaf = leafEls[current-1];
    leaf.style.zIndex = ++zCounter;
    setRot(leaf, 0, true);
    return new Promise(resolve=>{
      const onEnd = ()=>{
        leaf.removeEventListener("transitionend", onEnd);
        current--;
        updateControls();
        busy = false;
        resolve();
      };
      leaf.addEventListener("transitionend", onEnd);
    });
  }
  async function goTo(idx){
    idx = Math.max(0, Math.min(N-1, idx));
    while(current < idx) await goNext();
    while(current > idx) await goPrev();
  }
  nextBtn.addEventListener("click", goNext);
  prevBtn.addEventListener("click", goPrev);
  bookEl.goTo = goTo;

  /* open / close */
  function resetLeaves(){
    leafEls.forEach((leaf, i)=>{
      leaf.style.zIndex = N - i;
      setRot(leaf, 0, false);
    });
    current = 0;
    zCounter = N + 10;
    updateControls();
  }
  cover.addEventListener("click", ()=>{
    cover.style.display = "none";
    openWrap.style.display = "flex";
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=> bookEl.classList.add("open"));
    });
  });
  closeBtn.addEventListener("click", ()=>{
    bookEl.classList.remove("open");
    const done = ()=>{
      openWrap.removeEventListener("transitionend", done);
      openWrap.style.display = "none";
      cover.style.display = "flex";
      resetLeaves();
    };
    openWrap.addEventListener("transitionend", done);
  });

  /* drag / swipe */
  let dragging = false, startX = 0, activeLeaf = null, mode = null, baseDeg = 0, frameWidth = 1;
  function pointerDown(e){
    if(N <= 1 || busy) return;
    dragging = true;
    startX = e.clientX;
    activeLeaf = null; mode = null;
    frameWidth = frame.getBoundingClientRect().width || 260;
    frame.setPointerCapture && e.pointerId != null && frame.setPointerCapture(e.pointerId);
  }
  function pointerMove(e){
    if(!dragging) return;
    const dx = e.clientX - startX;
    if(!activeLeaf){
      if(dx < -6 && current < N-1){
        activeLeaf = leafEls[current]; mode = "next"; baseDeg = 0;
      } else if(dx > 6 && current > 0){
        activeLeaf = leafEls[current-1]; mode = "prev"; baseDeg = -180;
        activeLeaf.style.zIndex = ++zCounter;
      } else {
        return;
      }
    }
    const prop = dx / frameWidth;
    let deg = baseDeg + prop * 200;
    deg = Math.max(-180, Math.min(0, deg));
    setRot(activeLeaf, deg, false);
  }
  function pointerUp(){
    if(!dragging) return;
    dragging = false;
    if(!activeLeaf) return;
    const deg = activeLeaf.__rot;
    if(mode === "next"){
      if(deg < -90){
        setRot(activeLeaf, -180, true);
        const onEnd=()=>{activeLeaf.removeEventListener("transitionend", onEnd); activeLeaf.style.zIndex=-1; current++; updateControls();};
        activeLeaf.addEventListener("transitionend", onEnd);
      } else {
        setRot(activeLeaf, 0, true);
      }
    } else if(mode === "prev"){
      if(deg > -90){
        setRot(activeLeaf, 0, true);
        const onEnd=()=>{activeLeaf.removeEventListener("transitionend", onEnd); current--; updateControls();};
        activeLeaf.addEventListener("transitionend", onEnd);
      } else {
        setRot(activeLeaf, -180, true);
      }
    }
    activeLeaf = null; mode = null;
  }
  frame.addEventListener("pointerdown", pointerDown);
  window.addEventListener("pointermove", pointerMove);
  window.addEventListener("pointerup", pointerUp);
  window.addEventListener("pointercancel", pointerUp);

  return bookEl;
}

/* ============================================================
   PAGE / VIEW BUILDERS
   ============================================================ */
function topbar(showCrumb){
  const bar = el("div", {class:"topbar"}, [
    el("a", {class:"wordmark", href:"#/"}, "Zon Institute"),
    showCrumb ? el("div", {class:"crumb"}, [
      el("a", {href:"#/business-units"}, "Business Units"),
      el("span", {}, "/"),
      el("span", {}, showCrumb)
    ]) : el("div", {class:"crumb"}, [])
  ]);
  return bar;
}

function pageHead(title, sub){
  return el("div", {class:"page-head"}, [
    el("h1", {}, title),
    sub ? el("p", {}, sub) : null
  ]);
}

function siteFooter(){
  return el("footer", {class:"site"}, "Zon Institute");
}

function viewHome(){
  const wrap = el("div", {class:"view"});
  const underlineWrap = el("div", {class:"underline-wrap"});
  underlineWrap.innerHTML = `
    <svg viewBox="0 0 600 22" preserveAspectRatio="none">
      <path d="M2 14 C 90 2, 150 22, 230 12 S 380 2, 460 14 S 560 20, 598 8"/>
    </svg>
  `;
  wrap.appendChild(el("div", {class:"home"}, [
    el("h1", {class:"home-title"}, "Zon Institute"),
    underlineWrap,
    el("p", {class:"home-sub"}, "Zon Institute is an independent private institute spanning research, education, media, and other areas of activity."),
    el("nav", {class:"nav-grid"}, NAV_ITEMS.map(n=>
      el("a", {class:"nav-btn", href:`#/${n.route}`}, n.label)
    ))
  ]));
  requestAnimationFrame(()=>{
    const path = underlineWrap.querySelector("path");
    if(!path || !path.getTotalLength) return;
    const len = path.getTotalLength();
    path.style.strokeDasharray = `${len*0.35} ${len*0.65}`;
    path.style.strokeDashoffset = "0";
    path.style.opacity = "1";
    if(path.animate){
      path.animate(
        [{ strokeDashoffset: 0 }, { strokeDashoffset: -len }],
        { duration: 2600, iterations: Infinity, easing: "linear" }
      );
    }
  });
  return wrap;
}

function viewAbout(){
  const wrap = el("div", {class:"view"});

  ]);

  wrap.appendChild(content);

}

  return wrap;

/* ============================================================
   ROUTER
   ============================================================ */
const ROUTES = {
  "": viewHome,
  "about": viewAbout,
  "business-units": viewBusinessUnits,
  "business-units/youtube": viewYoutube,
  "business-units/x": ()=>viewSocialStub("X"),
  "business-units/instagram": ()=>viewSocialStub("Instagram"),
  "business-units/itchio": ()=>viewSocialStub("Itch.io"),
  "events": viewEvents,
  "affiliates": viewAffiliates,
  "connect": viewConnect
};

function render(){
  const raw = location.hash.replace(/^#\/?/, "").replace(/\/$/, "");
  const build = ROUTES[raw] || viewHome;
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(build());
  window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});
}

window.addEventListener("hashchange", render);
render();
</script>
